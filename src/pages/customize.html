<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TocRooms - Customize</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/customization.css">
</head>

<body>
    <div class="site">
        <div class="header">
            <div class="brand-art">TocRooms<small>BETA 1</small></div>
        </div>

        <nav class="nav">
            <a href="../../index.html">Home</a>
            <a href="maps.html">Maps</a>
            <a href="customize.html">Customize</a>
            <a href="news.html">News</a>
            <a href="info.html">Info</a>
        </nav>

        <main>
            <h1>Character Customization</h1>
            <p>Choose a preset model, pick body parts to customize, or rotate the character preview.</p>
            <div class="customize-layout">
                <div class="preview-box">
                    <canvas id="avatarPreview"></canvas>
                    <p class="meta" style="margin: 8px 0 0;">Drag left/right to rotate preview</p>
                </div>
                <div class="controls-box">
                    <div class="preset-section">
                        <h3>Model Presets</h3>
                        <div class="preset-list" id="presetList"></div>
                    </div>

                    <h3>Select Body Part</h3>
                    <div class="part-selector" id="partSelector">
                        <button type="button" class="part-btn active" data-part="head">Head</button>
                        <button type="button" class="part-btn" data-part="torso">Torso</button>
                        <button type="button" class="part-btn" data-part="leftArm">Left Arm</button>
                        <button type="button" class="part-btn" data-part="rightArm">Right Arm</button>
                        <button type="button" class="part-btn" data-part="leftLeg">Left Leg</button>
                        <button type="button" class="part-btn" data-part="rightLeg">Right Leg</button>
                    </div>

                    <h3>Pick a Color (<span id="selectedPartLabel">Head</span>)</h3>
                    <div class="color-palette" id="colorPalette"></div>

                    <div class="custom-picker-row">
                        <label for="customColorInput"><strong>Custom Hex Color:</strong></label>
                        <input type="color" id="customColorInput" value="#ffe0bd">
                    </div>

                    <div class="action-buttons">
                        <button type="button" class="btn-primary" id="saveColorsBtn">Save Appearance</button>
                        <button type="button" class="btn-secondary" id="resetColorsBtn">Reset to Default</button>
                        <span id="saveStatus">Saved!</span>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <a href="../../index.html">Home</a> |
            <a href="info.html">About TocRooms</a> |
            <a href="news.html">News</a>
        </footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/player.js"></script>
    <script src="../js/custom/colors.js"></script>
    <script src="../js/custom/presets.js"></script>
    <script src="../js/custom/customize.js"></script>
</body>

</html>
